services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./backend:/app
      - generated-docs:/app/generated
      - backend-data:/app/data
      - backend-storage:/app/storage
    depends_on: [redis]
  celery:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      - ./backend:/app
      - generated-docs:/app/generated
      - backend-data:/app/data
      - backend-storage:/app/storage
    depends_on: [redis, backend]
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  generated-docs:
  backend-data:
  backend-storage:
  ollama-models:
